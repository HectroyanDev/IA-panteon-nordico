<title>Midgard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: "Tablero de operaciones". Cifras arriba, un panel por repositorio, avisos Jira↔repo como fila ámbar y bloque "Sin PR" al final. */
:root {
  --bg: #f3f5f6; --surface: #ffffff; --ink: #18232b; --muted: #5b6b76; --line: #d5dde2;
  --accent: #2f6f8f;            /* azul fiordo */
  --ok: #2e7d4f; --warn: #a86a00; --crit: #b23a3a; --info: #3a64a8;
  --ok-bg: #e3f2e8; --warn-bg: #fbf0d9; --crit-bg: #f8e1e1; --info-bg: #e2ebf8;
  --console: #ffffff; --console-head: #eef2f4;
  --f-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f171c; --surface: #16222a; --ink: #e3eaee; --muted: #93a4ae; --line: #2a3a44;
  --accent: #7cb7d4; --ok: #6fcf97; --warn: #f0b75a; --crit: #ef7c7c; --info: #8fb0ec;
  --ok-bg: #173226; --warn-bg: #3a2c12; --crit-bg: #3d1c1e; --info-bg: #1c2a42;
  --console: #121c22; --console-head: #1a2830; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f171c; --surface: #16222a; --ink: #e3eaee; --muted: #93a4ae; --line: #2a3a44;
  --accent: #7cb7d4; --ok: #6fcf97; --warn: #f0b75a; --crit: #ef7c7c; --info: #8fb0ec;
  --ok-bg: #173226; --warn-bg: #3a2c12; --crit-bg: #3d1c1e; --info-bg: #1c2a42;
  --console: #121c22; --console-head: #1a2830; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
a { color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: end; justify-content: space-between; margin-bottom: 16px; }
header.top h1 { font-family: var(--f-display); font-size: 30px; margin: 0; letter-spacing: -.01em; }
.meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.meta b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

.bands { display: grid; gap: 8px; margin-bottom: 16px; }
.band { padding: 8px 12px; border-radius: 6px; font-size: 13px; border: 1px solid var(--line); border-left-width: 4px; background: var(--console); }
.band.src { border-left-color: var(--crit); background: var(--crit-bg); }
.band.lost { border-left-color: var(--info); background: var(--info-bg); }
.band b { font-weight: 600; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 18px; }
.kpi { background: var(--console); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.kpi .n { font-family: var(--f-mono); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.kpi.warn .n { color: var(--warn); } .kpi.crit .n { color: var(--crit); }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); } .chip.crit { background: var(--crit-bg); color: var(--crit); }
.chip.info { background: var(--info-bg); color: var(--info); }
.chip.neutral { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.chip.incomplete { background: transparent; color: var(--muted); border: 1px dotted var(--muted); font-family: var(--f-mono); font-size: 11px; }
.host { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.alert { display: flex; gap: 8px; align-items: flex-start; background: var(--warn-bg); color: var(--ink); border-left: 3px solid var(--warn); padding: 6px 10px; font-size: 13px; border-radius: 0 4px 4px 0; }
.alert .bang { flex: none; width: 18px; height: 18px; border-radius: 50%; background: var(--warn); color: var(--bg); font-weight: 700; font-size: 12px; display: grid; place-items: center; }
.stale-tag { font-family: var(--f-mono); font-size: 11px; color: var(--crit); }

.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 540px), 1fr)); gap: 16px; align-items: start; }
.panel { background: var(--console); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.panel > header { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 9px 14px; background: var(--console-head); border-bottom: 1px solid var(--line); border-radius: 8px 8px 0 0; }
.panel > header h3 { margin: 0; font-family: var(--f-mono); font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
.scroll { overflow-x: auto; }
table.ops { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 520px; }
table.ops th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 7px 14px; border-bottom: 1px solid var(--line); }
table.ops td { padding: 8px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.ops tr:last-child td { border-bottom: 0; }
table.ops td.k { font-family: var(--f-mono); font-size: 12px; white-space: nowrap; }
table.ops td.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.ops tr.alertrow td { padding-top: 0; }
table.ops tr.stale td:first-child { box-shadow: inset 3px 0 0 var(--crit); }
.jira { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.ttl { margin-top: 3px; overflow-wrap: anywhere; }
.rev { display: flex; flex-direction: column; gap: 2px; font-size: 12px; }
.rev .who { color: var(--muted); font-family: var(--f-mono); font-size: 11px; }
.warn-tag { font-family: var(--f-mono); font-size: 11px; color: var(--warn); }
details.merged { grid-column: 1 / -1; }
details.merged > summary { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; align-items: center; padding: 9px 14px; background: var(--console-head); border-radius: 8px; cursor: pointer; list-style: none; }
details.merged > summary::-webkit-details-marker { display: none; }
details.merged[open] > summary { border-bottom: 1px solid var(--line); border-radius: 8px 8px 0 0; }
details.merged > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
details.merged .sum-title { display: flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 13px; font-weight: 600; }
details.merged .sum-title::before { content: ""; width: 6px; height: 6px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; }
details.merged[open] .sum-title::before { transform: rotate(45deg); }
details.merged .sum-info { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
ul.mlist { list-style: none; margin: 0; padding: 0; }
ul.mlist li { padding: 8px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; min-width: 0; }
ul.mlist li:last-child { border-bottom: 0; }
ul.mlist li.stale { box-shadow: inset 3px 0 0 var(--crit); }
.m-main { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; min-width: 0; }
.m-main .k { font-family: var(--f-mono); font-size: 12px; white-space: nowrap; }
.m-main .ttl { margin: 0; flex: 1 1 220px; min-width: 0; }
.m-repos { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; font-size: 12px; }
.m-repo { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.m-none { color: var(--muted); }
.empty { background: var(--console); border: 1px dashed var(--line); border-radius: 8px; padding: 28px 16px; text-align: center; color: var(--muted); }
</style>

<div class="wrap">
  <header class="top">
    <h1>Midgard</h1>
    <div class="meta" id="meta"></div>
  </header>
  <div class="bands" id="bands"></div>
  <div id="kpis"></div>
  <div id="body"></div>
</div>

<script type="application/json" id="snapshot">__SNAPSHOT_JSON__</script>
<script>
(function () {
  "use strict";
  var snap = JSON.parse(document.getElementById("snapshot").textContent);
  var LOST_MS = 2 * 60 * 60 * 1000;
  var MONTHS = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  var DAYS = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
  var pad = function (n) { return (n < 10 ? "0" : "") + n; };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function safeHref(u) { return typeof u === "string" && /^https:\/\//.test(u) ? esc(u) : null; }
  function link(url, text, cls) {
    var h = safeHref(url);
    return h ? '<a href="' + h + '" target="_blank" rel="noopener"' + (cls ? ' class="' + cls + '"' : "") + ">" + esc(text) + "</a>" : esc(text);
  }
  function hm(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function dayLabel(d) { return d.getDate() + " " + MONTHS[d.getMonth()]; }
  function fmtDate(iso) { var d = new Date(iso); return dayLabel(d) + ", " + hm(d); }
  function fmtNext(iso) {
    var d = new Date(iso), n = new Date();
    var same = d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
    return "~" + (same ? "" : DAYS[d.getDay()] + " ") + hm(d);
  }
  function chip(text, tone) { return '<span class="chip ' + tone + '">' + esc(text) + "</span>"; }

  // Cabecera
  var meta = '<span>Actualizado <b>' + esc(fmtDate(snap.generatedAt)) + "</b></span>";
  if (snap.nextRun) meta += '<span>próxima <b>' + esc(fmtNext(snap.nextRun)) + "</b> (si la app está abierta)</span>";
  meta += "<span>estancado tras <b>" + esc(snap.staleDays) + " días laborables</b></span>";
  document.getElementById("meta").innerHTML = meta;

  // Bandas: fuentes caídas y refresco perdido
  var bands = "";
  snap.sources.forEach(function (s) {
    if (s.ok) return;
    var why = s.error ? " (" + esc(s.error) + ")" : "";
    var tail = s.usingDataFrom ? " Datos de " + esc(s.label) + " del " + esc(fmtDate(s.usingDataFrom)) + "." : " Sin datos de " + esc(s.label) + ".";
    bands += '<div class="band src"><b>' + esc(s.label) + " no respondió</b>" + why + "." + tail + "</div>";
  });
  if (snap.nextRun && Date.now() - Date.parse(snap.nextRun) > LOST_MS) {
    bands += '<div class="band lost"><b>El refresco previsto no ha llegado.</b> La tarea programada puede no estar corriendo; la próxima era ' + esc(fmtNext(snap.nextRun)) + ".</div>";
  }
  document.getElementById("bands").innerHTML = bands;
  if (!bands) document.getElementById("bands").hidden = true;

  // Cifras
  var K = [["inProgress", "Tickets en curso", ""], ["openPrs", "PRs abiertas", ""], ["waiting", "Esperando revisión", ""],
    ["changes", "Cambios pedidos", "crit"], ["stale", "Estancadas", "crit"], ["warned", "Avisos Jira ↔ repo", "warn"]];
  document.getElementById("kpis").innerHTML = '<div class="kpis">' + K.map(function (k) {
    var v = snap.kpis ? snap.kpis[k[0]] : null;
    return '<div class="kpi ' + (v ? k[2] : "") + '"><div class="n">' + (v == null ? "—" : esc(v)) + '</div><div class="l">' + esc(k[1]) + "</div></div>";
  }).join("") + "</div>";

  // Piezas de fila
  var TONE = { merged: "ok", declined: "neutral", draft: "neutral", changes: "crit", ready: "ok", waiting: "info" };
  function jiraCell(r) {
    var h = '<div class="jira">' + chip(r.status, "neutral");
    (r.incomplete || []).forEach(function (src) { h += '<span class="chip incomplete">incompleto: ' + esc(src) + "</span>"; });
    return h + "</div>";
  }
  function days(r, stale) {
    return esc(r.days) + " d" + (stale ? ' <span class="stale-tag" title="Estancado" aria-label="estancado">●</span>' : "");
  }
  function alertBox(r) {
    var w = r.warning;
    if (!w) return "";
    var links = " " + link(w.ticketUrl, "Abrir " + r.key);
    (w.prs || []).forEach(function (p) { links += " · " + link(p.url, "#" + p.number); });
    return '<div class="alert"><span class="bang" aria-hidden="true">!</span><span>' + esc(w.text) + links + "</span></div>";
  }
  function alertRow(r, cols) {
    return r.warning ? '<tr class="alertrow"><td colspan="' + cols + '">' + alertBox(r) + "</td></tr>" : "";
  }
  function prRow(r) {
    var p = r.pr;
    var rev = p.review.length
      ? p.review.map(function (x) { return x.charAt(0) === "→" ? '<span class="who">' + esc(x) + "</span>" : "<span>" + esc(x) + "</span>"; }).join("")
      : "—";
    return '<tr class="' + (p.stale ? "stale" : "") + '"><td class="k">' + link(r.ticketUrl, r.key) + "</td><td>" + jiraCell(r) +
      "</td><td>" + link(p.url, "#" + p.number) + " " + chip(p.statusLabel, TONE[p.statusCode] || "neutral") + '<div class="ttl">' + esc(r.title) + "</div></td>" +
      '<td><div class="rev">' + rev + '</div></td><td class="num">' + days(p, p.stale) + "</td></tr>" + alertRow(r, 5);
  }
  function panel(p) {
    return '<section class="panel"><header><h3>' + esc(p.repo) + '</h3><span class="host">' + esc(p.hostLabel) + " · " + esc(p.rows.length) + " PR</span></header>" +
      '<div class="scroll"><table class="ops"><thead><tr><th>Ticket</th><th>Jira</th><th>PR</th><th>Revisión</th><th>Quieta</th></tr></thead><tbody>' +
      p.rows.map(prRow).join("") + "</tbody></table></div></section>";
  }
  function noPrRow(r) {
    return '<tr class="' + (r.stale ? "stale" : "") + '"><td class="k">' + link(r.ticketUrl, r.key) + "</td><td>" + jiraCell(r) +
      '</td><td class="ttl" style="margin:0">' + esc(r.title) + '</td><td class="num">' + days(r, r.stale) + "</td></tr>" + alertRow(r, 4);
  }
  function noPrPanel(rows) {
    return '<section class="panel"><header><h3>Sin PR</h3><span class="host">' + esc(rows.length) + " tickets</span></header>" +
      '<div class="scroll"><table class="ops"><thead><tr><th>Ticket</th><th>Jira</th><th>Título</th><th>Quieto</th></tr></thead><tbody>' +
      rows.map(noPrRow).join("") + "</tbody></table></div></section>";
  }

  // Panel plegable "Mergeados en dev": lista compacta, sin detalle de revisión; las marcas de estancado y los avisos explican las cifras.
  function staleMark(d) { return ' <span class="stale-tag" title="Estancado" aria-label="estancado">● ' + esc(d) + " d</span>"; }
  function mergedRow(r) {
    var h = '<li class="' + (r.stale ? "stale" : "") + '"><div class="m-main"><span class="k">' + link(r.ticketUrl, r.key) + '</span><span class="ttl">' + esc(r.title) + "</span></div>";
    var parts = r.repos.map(function (rp) {
      return '<span class="m-repo"><span class="host">' + esc(rp.hostLabel) + " · " + esc(rp.repo) + "</span>" + rp.prs.map(function (p) {
        return "<span>" + link(p.url, "#" + p.number) + " " + chip(p.statusLabel, TONE[p.statusCode] || "neutral") + (p.stale ? staleMark(p.days) : "") + "</span>";
      }).join(" ") + "</span>";
    });
    if (!r.repos.length) parts.push('<span class="m-none">sin PR enlazada' + (r.stale ? staleMark(r.days) : "") + "</span>");
    (r.incomplete || []).forEach(function (src) { parts.push('<span class="chip incomplete">incompleto: ' + esc(src) + "</span>"); });
    return h + '<div class="m-repos">' + parts.join("") + "</div>" + alertBox(r) + "</li>";
  }
  function mergedPanel(rows, sum) {
    var info = "";
    if (sum.stale > 0) info += '<span class="stale-tag">' + esc(sum.stale) + (sum.stale === 1 ? " estancado" : " estancados") + "</span>";
    if (sum.warned > 0) info += '<span class="warn-tag">' + esc(sum.warned) + (sum.warned === 1 ? " aviso" : " avisos") + "</span>";
    info += '<span class="host">' + esc(sum.total) + (sum.total === 1 ? " ticket" : " tickets") + "</span>";
    return '<details class="panel merged"><summary><span class="sum-title">Mergeados en dev</span><span class="sum-info">' + info + "</span></summary>" +
      '<ul class="mlist">' + rows.map(mergedRow).join("") + "</ul></details>";
  }

  var body = "";
  if (snap.jiraDown) {
    body = '<div class="empty">Sin datos de Jira: no se pueden mostrar los tickets en curso.</div>';
  } else if (snap.empty) {
    body = '<div class="empty">No hay tickets en curso.</div>';
  } else {
    body = '<div class="panels">' + snap.panels.map(panel).join("") + (snap.noPr.length ? noPrPanel(snap.noPr) : "") +
      (snap.mergedDev && snap.mergedDev.length ? mergedPanel(snap.mergedDev, snap.mergedDevSummary) : "") + "</div>";
  }
  document.getElementById("body").innerHTML = body;
})();
</script>
